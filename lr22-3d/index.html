<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛР-22 · EXPLAIN</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../common/pg.css?v=bbd421d4e4">
</head>
<body class="pg">
<header id="pgTop">
  <span class="pg-app">ЛР-22 · План выполнения запроса: EXPLAIN<small>library · PostgreSQL в браузере</small></span>
  <div id="topR"><button class="btn sub" id="subBtn">Сдать работу</button><button class="btn" id="menuBtn">Выход</button><button id="homeBtn" hidden></button><button id="gfxBtn" hidden></button><button id="sndBtn" hidden></button></div>
</header>
<div id="pgMain">
  <aside id="stage" class="pg-pane"></aside>
  <section id="deck" class="pg-pane">
    <div class="pg-ph">Query Tool<span id="psql" class="psql" data-db="library" data-su="1">library=#</span></div>
    <div class="pg-bar">
      <button id="runBtn" title="Выполнить: F5 или Ctrl+Enter">▶ Выполнить</button>
      <button class="btn sm" id="rsDeck" title="Вернуть базу к началу уровня; текст запроса останется">↺ Сброс уровня</button>
      <span class="spd"><button data-spd="1">×1</button><button data-spd="3" class="on">×3</button><button data-spd="99">⏭</button></span>
      <span class="pg-keys">F5 или Ctrl+Enter — выполнить · Ctrl+↑ — прошлая команда</span>
    </div>
    <div class="pg-ed"><pre id="pgGut" aria-hidden="true"></pre><textarea id="sql" wrap="off" spellcheck="false" placeholder="EXPLAIN ANALYZE SELECT … FROM book WHERE …;"></textarea></div>
    <div id="pgOut" data-tab="data">
      <div class="pg-tabs"><button data-tab="data">Data Output</button><button data-tab="msg">Messages</button><button data-tab="plan" disabled>Explain</button></div>
      <div class="pg-res"><div id="result"></div><div id="pgPlan"></div><div class="pg-empty">Нет данных. Выполните запрос — результат появится здесь.</div></div>
      <div id="pgStatus"></div>
    </div>
  </section>
  <aside id="side" class="pg-pane"><div class="pg-ph">Задание</div><div id="levels"></div><div id="verdict"></div><div id="mission"></div></aside>
</div>
<div id="cnt" hidden></div>
<div id="cmd" hidden></div>
<div id="rewind" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<div id="proto" hidden></div>
<div id="loading">Запуск PostgreSQL…</div>
<script src="game.js?v=3ce8ddfd1d"></script>
</body>
</html>

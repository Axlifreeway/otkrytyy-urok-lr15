<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛР-14 · UPDATE и DELETE</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #22252b; --sun: #ffc21a; --sun2: #f0a800; --teal: #2f6f73; --red: #d2483c; --green: #3f9a5a; --blue: #2d6fb5; --paper: #fffaf0;
    --font: 'Rubik', 'Segoe UI', Arial, sans-serif; --mono: 'JetBrains Mono', Consolas, monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: #dcd6c9 }
  [hidden] { display: none !important }
  button { font-family: var(--font); cursor: pointer }
  code { font-family: var(--mono); font-size: .88em; background: #f1e8d2; padding: 0 4px; border-radius: 3px }
  #stage { position: fixed; inset: 0 }
  #stage canvas { display: block }
  .labels { position: absolute; inset: 0; pointer-events: none }
  .panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); border-radius: 6px }
  .btn { background: #fff; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 6px; font-weight: 700; font-size: 14px; padding: 7px 12px; color: var(--ink) }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink) }
  .btn.off { text-decoration: line-through; opacity: .6 }
  .btn.sm { font-size: 13px; padding: 4px 10px; border-width: 2.5px; box-shadow: 2px 2px 0 var(--ink) }
  .nextBtn { background: var(--sun); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 6px; font-weight: 800; font-size: 17px; padding: 8px 18px; color: var(--ink) }
  .nextBtn:hover { background: var(--sun2) }
  .tag { display: inline-block; background: var(--ink); color: var(--sun); font-weight: 700; font-size: 12px; letter-spacing: .12em; padding: 3px 8px; border-radius: 3px }

  /* карта уровней */
  #levels { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 4; display: flex; gap: 6px; padding: 7px 9px }
  .lvb { width: 34px; height: 34px; border: 2.5px solid var(--ink); border-radius: 6px; background: #fff; font-weight: 800; font-size: 15px; color: var(--ink) }
  .lvb:disabled { background: #e7e1d3; font-size: 12px; cursor: default; opacity: .8 }
  .lvb.done { background: var(--green); color: #fff }
  .lvb.on { background: var(--sun); color: var(--ink); transform: translateY(-3px); box-shadow: 0 3px 0 var(--ink) }
  .lvb.fin { width: 42px }

  #mission { position: fixed; left: 18px; top: 18px; width: 350px; padding: 14px 16px; z-index: 3; max-height: calc(100vh - 230px); overflow: auto }
  #mission h1 { font-size: 25px; font-weight: 800; margin: 6px 0 2px; line-height: 1.05 }
  #mission .lab { font-size: 12px; color: #6b6e75; font-weight: 600; margin-bottom: 6px }
  #mission p { font-size: 15px; line-height: 1.4 }
  #mission ul { list-style: none; margin-top: 8px; font-size: 14px }
  #mission li { padding: 3px 0 3px 26px; position: relative }
  #mission li::before { content: ''; position: absolute; left: 0; top: 5px; width: 16px; height: 16px; border: 2.5px solid var(--ink); border-radius: 4px; background: #fff }
  #mission li.done::before { background: var(--green); box-shadow: inset 0 0 0 3px #fff }
  .mbtn { display: flex; gap: 6px; margin-top: 10px }
  .hintx { margin-top: 8px; background: #fff3c8; border: 2px solid var(--ink); border-radius: 5px; padding: 6px 9px; font: 500 13px var(--mono) }
  #mission .hint { margin-top: 10px; font-size: 12.5px; color: #5c5f66; border-top: 2px dashed #d8d0bd; padding-top: 8px }
  .slots { display: flex; gap: 5px; margin-top: 8px } .slots:empty { display: none }
  .slot { flex: 1; border: 2.5px dashed #b8b0a0; border-radius: 5px; padding: 4px 6px; font-size: 11px; color: #6b6e75; min-width: 0 }
  .slot b { display: block; font-size: 12px } .slot span { font-family: var(--mono); font-size: 10px; word-break: break-all }
  .slot.on { border: 2.5px solid var(--ink); background: var(--red); color: #fff }

  #topR { position: fixed; right: 18px; top: 18px; display: flex; gap: 8px; z-index: 3 }
  #cnt { position: fixed; right: 18px; top: 74px; z-index: 3; padding: 8px 14px; font-size: 15px }
  #cnt b { font-size: 20px; font-weight: 800 }
  #cmd { position: fixed; left: 50%; bottom: 196px; transform: translateX(-50%); z-index: 3; padding: 8px 16px; background: var(--ink); color: #fff; display: flex; flex-direction: column; align-items: center; max-width: 620px; text-align: center }
  #cmd .k { font: 700 14px var(--mono); color: var(--sun) } #cmd .w { font: 600 17px var(--mono) } #cmd .n { font: 600 12px var(--font); color: #9fdcae; margin-top: 2px }

  #deck { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(980px, calc(100vw - 36px)); z-index: 4; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px }
  #sql { grid-row: span 3; width: 100%; height: 86px; resize: none; border: 3px solid var(--ink); border-radius: 5px; background: #23262c; color: #f6f1e3; font: 500 17px/1.45 var(--mono); padding: 8px 12px; outline: none; caret-color: var(--sun) }
  #runBtn { background: var(--sun); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 6px; font-weight: 800; font-size: 19px; padding: 0 22px; letter-spacing: .04em }
  #runBtn:hover { background: var(--sun2) } #runBtn:disabled { opacity: .5 }
  .spd { display: flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 600 }
  .spd button { border: 2.5px solid var(--ink); background: #fff; border-radius: 5px; font-weight: 700; font-size: 13px; padding: 3px 8px }
  .spd button.on { background: var(--ink); color: var(--sun) }
  #result { grid-column: span 2; font: 600 14px var(--mono); min-height: 18px; min-width: 0; overflow-wrap: anywhere; white-space: normal; max-height: 22vh; overflow-y: auto }
  #result .ok { color: var(--green) } #result .bad { color: var(--red) }
  #result .ru { font: 500 13.5px var(--font); color: #4a4d55; margin-top: 2px }
  #verdict { position: fixed; left: 50%; transform: translateX(-50%); bottom: 192px; z-index: 4; width: min(640px, calc(100vw - 36px)) }
  .v-ok, .v-bad { border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); border-radius: 6px; padding: 10px 14px; font-size: 15px; background: #e9f6ec; animation: pop .35s cubic-bezier(.3,1.6,.6,1) }
  .v-bad { background: #fbe5e2 }
  .v-ok b, .v-bad b { display: block; font-size: 22px; font-weight: 800 }
  .v-ok .nextBtn { margin-top: 10px }
  .pr { margin-top: 6px; font-size: 13.5px; font-weight: 600 } .pr.ok { color: var(--green) } .pr.no { color: var(--red) }
  @keyframes pop { from { transform: scale(.7) } }

  /* подписи в сцене */
  .rscreen { background: var(--ink); color: var(--sun); border-radius: 6px; padding: 3px 9px; font: 700 12px var(--mono) }
  .tag3 { font: 700 11px var(--font); color: #5c5f66; background: rgba(255,250,240,.85); border-radius: 4px; padding: 1px 6px; white-space: nowrap }
  .board { background: #22252b; color: var(--sun); font: 600 11px var(--mono); padding: 4px 8px; border-radius: 4px; border: 2px solid var(--ink); white-space: nowrap }
  .board div.on b { color: #fff } .board b { margin-right: 6px }
  .say span { display: block; background: #fff; border: 2.5px solid var(--ink); border-radius: 8px; padding: 3px 8px; font: 600 13px var(--font); white-space: nowrap; box-shadow: 2px 2px 0 var(--ink) }
  .chip { font: 800 15px var(--font); min-width: 28px; height: 28px; padding: 0 7px; border-radius: 14px; border: 2.5px solid var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 2px 2px 0 var(--ink) }
  .chip.yes { background: var(--green); color: #fff }
  .chip.no { background: var(--red); min-width: 12px; width: 12px; height: 12px; padding: 0; border-width: 2px; box-shadow: none }
  .chip.unk { background: #c9c3b3; color: var(--ink) }
  .chip.del { background: var(--red); color: #fff }
  .chip.extra { background: var(--red); color: #fff; font-size: 12px; border-radius: 6px }
  .rcard { background: #fff; border: 3px solid var(--ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--ink); padding: 7px 12px; font-size: 15px; min-width: 200px; animation: pop .25s cubic-bezier(.3,1.6,.6,1) }
  .rcard .rc-h { font: 700 11px var(--mono); color: #6b6e75; letter-spacing: .04em; margin-bottom: 3px }
  .rcard div > span { color: #6b6e75; font-family: var(--mono); font-size: 13px; margin-right: 8px }
  .rcard div > b { font-family: var(--mono); font-size: 15px }
  .rc-x { font: 700 16px var(--mono); margin-top: 4px; white-space: nowrap }
  .rc-v { margin-top: 5px; text-align: center; font: 800 19px var(--font); border-radius: 4px; padding: 2px 6px; color: #fff }
  .rc-v.yes { background: var(--green) } .rc-v.no { background: var(--red) } .rc-v.unk { background: #8e887a } .rc-v.err { background: var(--red) }
  .rc-t { font-size: 12px; margin-top: 4px; max-width: 240px; white-space: normal }

  /* правки после первой пары */
  #mission, .rcard, table.doc, .legend { user-select: none; -webkit-user-select: none }
  .ncmd { margin-top: 8px; font: 700 13px var(--font); background: var(--ink); color: var(--sun); padding: 4px 8px; border-radius: 4px; display: inline-block }
  .legend { margin-top: 6px; font-size: 12.5px; line-height: 1.4; background: #eef3fb; border: 2px solid #b9cbe6; border-radius: 5px; padding: 5px 8px }
  .legend.ex { background: #fff3c8; border-color: #e3cf86 }
  .rsnote { margin-top: 6px; font-size: 12.5px; color: #5c5f66 }
  pre.sheet { margin-top: 6px; font: 500 12px/1.45 var(--mono); white-space: pre-wrap; background: #23262c; color: #f6f1e3; padding: 7px 9px; border-radius: 5px } pre.sheet i { color: #9fdcae; font-style: normal }
  .stars { margin-top: 6px; font-size: 22px; color: var(--sun2); letter-spacing: 2px } .stars span { font-size: 13px; color: #4a4d55; letter-spacing: 0; margin-left: 8px; font-weight: 600 }
  .lvb { position: relative } .lvb .st { position: absolute; left: 0; right: 0; bottom: -13px; font: 700 10px var(--font); color: var(--sun2); font-style: normal; letter-spacing: -1px; text-shadow: 0 0 2px #fff }
  #levels .pts { font: 800 17px var(--font); padding: 0 6px; align-self: center } #levels .pts small { font-size: 12px; color: #6b6e75 }
  #levels .demo { font: 800 13px var(--font); background: var(--red); color: #fff; padding: 4px 8px; border-radius: 4px; align-self: center }
  .btn.sub { background: var(--green); color: #fff }
  .rsv { margin-top: 8px; margin-right: 8px } .v-bad .mu { font-size: 12.5px; color: #6b6e75 }
  .dlg-id { display: flex; gap: 8px; margin-top: 12px } .dlg-id input { flex: 1; font: 600 17px var(--font); padding: 6px 10px; border: 3px solid var(--ink); border-radius: 6px; outline: none; min-width: 0 }
  .dlg-id input:nth-child(2) { flex: 0 0 120px }
  #startErr { color: var(--red); font-weight: 600; font-size: 14px; min-height: 18px }
  #toast { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); z-index: 8; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 6px; padding: 8px 14px; font: 600 15px var(--font); box-shadow: 4px 4px 0 var(--ink); max-width: min(620px, calc(100vw - 36px)) }
  /* минимальные размеры текста */
  .tag3, .gseat, .qtag, .board { font-size: 12px !important } .slot span { font-size: 12px } .slot b { font-size: 12.5px }
  .rcard .rc-h { font-size: 12px } .rcard div > span { font-size: 13px } table.doc th { font-size: 11.5px }
  details.schema div { font-size: 12px } #mission .lab { font-size: 12.5px } .pr-mu { font-size: 12px }
  @media (max-width: 1150px) { #mission { width: 310px } #mission h1 { font-size: 21px } #mission p { font-size: 14px } }
  @media (max-height: 760px) { #sql { height: 84px } #mission { max-height: calc(100vh - 220px) } }

  /* левая колонка: уровни над заданием; сообщения — справа, чтобы не закрывать задание */
  #side { position: fixed; left: 18px; top: 18px; width: 372px; z-index: 3; display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 250px) }
  #side #levels { position: static; transform: none; display: flex; flex-wrap: wrap; gap: 14px 4px; padding: 6px 8px 12px; align-items: center }
  #side #mission { position: static; width: auto; max-height: none; flex: 1 1 auto; min-height: 0; overflow: auto }
  #side .lvb { width: 26px; height: 28px; font-size: 13px; border-width: 2px } #side .lvb.fin { width: 32px } #side .lvb .st { bottom: -12px; font-size: 9px }
  #verdict { left: auto; right: 18px; transform: none; width: min(560px, calc(100vw - 430px)) }
  #cmd { left: auto; right: 18px; transform: none; max-width: min(620px, calc(100vw - 430px)) }
  #toast { left: auto; right: 18px; transform: none }
  @media (max-width: 1150px) { #side { width: 320px } #verdict, #cmd { width: auto; max-width: calc(100vw - 370px) } #topR .btn { font-size: 12.5px; padding: 5px 9px } }
  @media (max-height: 760px) { #side { max-height: calc(100vh - 220px) } }
  .vx { float: right; margin: -4px -6px 0 8px; border: 2px solid var(--ink); background: #fff; border-radius: 4px; font-weight: 800; cursor: pointer; padding: 0 6px }
  .v-bad { max-height: 34vh; overflow-y: auto }
  .lg { display: grid; grid-template-columns: 1fr 1.6fr 110px; gap: 8px; margin-top: 12px } .lg label { display: flex; flex-direction: column; font-size: 12.5px; color: #6b6e75; font-weight: 600; gap: 3px }
  .lg select, .lg input { font: 600 16px var(--font); padding: 6px 8px; border: 3px solid var(--ink); border-radius: 6px; background: #fff; min-width: 0 }
  .lg #lgP { font-family: var(--mono); letter-spacing: .2em } #lgNote { min-height: 18px; margin-top: 6px } #lgErr { color: var(--red); font-weight: 600; min-height: 18px }
  .lg + .btns .btn.sm { margin-left: auto } #lgTeach { grid-template-columns: 1fr 90px auto; align-items: end }
  .who { margin: 12px 0; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 6px; background: #fff; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap } .who b { font-size: 20px } .who span { color: #6b6e75 }
  .sync { font: 600 11.5px var(--font); color: var(--green); align-self: center; margin-left: 4px } .sync.off, .sync.auth { color: var(--red) } .sync.wait { color: #6b6e75 }
  .lvb.hard { border-color: var(--red); border-style: double; border-width: 4px } .tag.hardt { background: var(--red); color: #fff; margin-left: 6px }
  table.res { border-collapse: collapse; margin: 4px 0; font: 500 12.5px var(--mono) } table.res th { background: var(--ink); color: var(--sun); padding: 2px 6px; text-align: left; font-size: 11.5px } table.res td { border-bottom: 1px solid #ddd5c3; padding: 2px 6px }
  #rewind { position: fixed; inset: 0; z-index: 5; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(34,37,43,.08) 0 3px, transparent 3px 7px) }
  #rewind::after { content: '◀◀ ROLLBACK'; position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font: 800 44px var(--font); color: #fff; background: var(--red); border: 4px solid var(--ink); padding: 4px 22px; border-radius: 8px; box-shadow: 6px 6px 0 var(--ink) }
  #loading { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; font: 700 22px var(--font); background: rgba(255,250,240,.85) }

  #modal { position: fixed; inset: 0; z-index: 10; background: rgba(34,37,43,.45); display: flex; align-items: center; justify-content: center }
  .dlg { width: 540px; max-width: calc(100vw - 32px); padding: 18px 22px }
  .dlg h2 { font-size: 30px; font-weight: 800; margin: 8px 0 6px }
  .dlg p { font-size: 15.5px; line-height: 1.45; margin-top: 6px } .dlg .mu { color: #6b6e75; font-size: 13.5px; margin-top: 8px }
  .dlg-q { font-size: 18px; font-weight: 600; margin: 10px 0 12px; line-height: 1.35 }
  .dlg-ch { display: flex; flex-direction: column; gap: 6px }
  .dlg-ch button { text-align: left; background: #fff; border: 2.5px solid var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 15px; box-shadow: 2px 2px 0 var(--ink) }
  .dlg-ch button:hover { background: var(--sun) }
  .dlg-num { display: flex; gap: 10px; align-items: center; margin: 12px 0; color: #6b6e75; font-size: 13px }
  .dlg-num input { font: 700 26px var(--mono); width: 120px; padding: 4px 10px; border: 3px solid var(--ink); border-radius: 6px; outline: none }
  .btns { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap }
  .end-row { display: flex; margin: 12px 0; border: 3px solid var(--ink); border-radius: 6px; overflow: hidden }
  .end-row div { flex: 1; padding: 8px 10px; border-right: 2px solid var(--ink); background: #fff } .end-row div:last-child { border-right: none }
  .end-row b { display: block; font-size: 26px; font-weight: 800 } .end-row span { font-size: 12px; color: #6b6e75 }

  #proto { position: fixed; inset: 0; z-index: 12; background: #fff; overflow: auto; padding: 24px 32px }
  .pr-bar { display: flex; gap: 8px; margin-bottom: 14px }
  .pr-doc { max-width: 1000px; font-size: 13.5px }
  .pr-eye { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6b6e75 }
  .pr-doc h2 { font-size: 21px; margin: 4px 0 10px } .pr-doc h3 { font-size: 15px; text-transform: uppercase; border-bottom: 2px solid var(--ink); margin: 16px 0 6px }
  .pr-doc table { border-collapse: collapse; width: 100% } .pr-doc th, .pr-doc td { border: 1px solid #b9b2a0; padding: 4px 6px; text-align: left; vertical-align: top } .pr-doc th { background: #f1ece0 }
  .pr-doc pre { font: 11.5px var(--mono); white-space: pre-wrap; word-break: break-word } .pr-mu { color: #6b6e75; font-size: 11.5px }
  .pr-meta { display: grid; grid-template-columns: 120px 1fr; gap: 3px 12px } .pr-meta input { font: inherit; border: none; border-bottom: 1px solid var(--ink); width: 340px }
  .pr-q { margin-top: 8px } .pr-q textarea { width: 100%; min-height: 44px; font: inherit; border: 1px solid #b9b2a0; padding: 4px 6px }
  @media print { body > *:not(#proto) { display: none !important } #proto { position: static; padding: 0 } .pr-bar { display: none } html, body { overflow: visible; height: auto; background: #fff } }
  @media (max-width: 1150px) { #mission { width: 290px } #mission h1 { font-size: 21px } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="side"><div id="levels" class="panel"></div><div id="mission" class="panel"></div></div>
<div id="topR"><button class="btn sub" id="subBtn">Сдать</button><button class="btn" id="homeBtn">Обзор</button><button class="btn" id="gfxBtn">Графика</button><button class="btn" id="sndBtn">Звук</button><button class="btn" id="menuBtn">Выход</button></div>
<div id="cnt" class="panel" hidden></div>
<div id="cmd" class="panel" hidden></div>
<div id="verdict"></div>
<div id="deck" class="panel">
  <textarea id="sql" spellcheck="false" placeholder="SELECT … FROM passenger WHERE …;  или  UPDATE … SET … WHERE …;     Ctrl+Enter — пуск · Ctrl+↑ — прошлая команда"></textarea>
  <button id="runBtn">▶ ПУСК</button>
  <div class="spd">скорость <button data-spd="1" class="on">×1</button><button data-spd="3">×3</button><button data-spd="99">⏭</button></div>
  <button class="btn sm" id="rsDeck" title="Вернуть базу к началу уровня; команда останется">↺ Сброс уровня</button>
  <div id="result"></div>
</div>
<div id="rewind" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<div id="proto" hidden></div>
<div id="loading">Готовлю самолёт…</div>
<script type="module">
window.__pg = (async () => {
  let PGlite;
  try { ({PGlite} = await import('../mvp/vendor/pglite/index.js')); }
  catch (e) { ({PGlite} = await import('https://cdn.jsdelivr.net/npm/@electric-sql/pglite@0.5.8/dist/index.js')); }
  const db = new PGlite(); await db.query('select 1'); return db;
})();
</script>
<script src="game.js"></script>
</body>
</html>

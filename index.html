<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Город SQL · Основы проектирования баз данных</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffc21a'/%3E%3Cpath d='M16 4l3 9 9 4v2l-9-2-1 7 3 2v2l-5-1-5 1v-2l3-2-1-7-9 2v-2l9-4z' fill='%2322252b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="common/home.js"></script>
<script>
  // Пока «миры» после аэропорта закрыты, главная — это аэропорт, как раньше. Карту можно открыть ссылкой /?map.
  (function () {
    const force = new URLSearchParams(location.search).has('map');
    if (force) sessionStorage.setItem('city', '1');
    if (force || sessionStorage.getItem('city') === '1' || !Home.online) return;
    document.documentElement.classList.add('wait');
    const show = () => document.documentElement.classList.remove('wait');
    setTimeout(show, 2500);
    Home.labsOpen().then(o => (o && !Home.cityOpen(o) ? location.replace('airport/') : show()));
  })();
</script>
<style>
  :root { --ink: #22252b; --sun: #ffc21a; --sun2: #f0a800; --teal: #2f6f73; --red: #d2483c; --green: #3f9a5a; --paper: #fffaf0; --apron: #dcd6c9;
    --font: 'Rubik', 'Segoe UI', Arial, sans-serif; --mono: 'JetBrains Mono', Consolas, monospace }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  [hidden] { display: none !important }
  html.wait body { visibility: hidden }
  body { font-family: var(--font); color: var(--ink); background: var(--apron); min-height: 100vh; overflow-x: hidden }
  a { color: inherit }
  main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 22px 16px 48px }
  .panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); border-radius: 8px }
  .tag { display: inline-block; background: var(--ink); color: var(--sun); font-weight: 700; font-size: 12px; letter-spacing: .14em; padding: 3px 9px; border-radius: 3px; text-transform: uppercase }
  .hero { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 16px 20px }
  .logo { width: 74px; height: 74px; background: var(--sun); border: 3px solid var(--ink); border-radius: 10px; display: grid; place-items: center; box-shadow: 3px 3px 0 var(--ink) }
  .logo svg { width: 50px }
  .hero h1 { font-size: clamp(26px, 4.4vw, 44px); font-weight: 800; line-height: 1; margin: 6px 0 4px }
  .motto { font: 700 15px var(--mono); color: #6b6e75 }
  .who { text-align: right; font-size: 14px; min-width: 190px }
  .who b { display: block; font-size: 17px }
  .who .mu, .mu { color: #6b6e75; font-size: 13px }
  .who a { font-size: 13px; color: #6b6e75; cursor: pointer }
  .clock { font: 800 30px var(--mono); letter-spacing: .04em }
  /* стойка регистрации — как в аэропорту */
  .checkin { margin-top: 22px; padding: 14px 20px; display: flex; gap: 12px 16px; align-items: flex-end; flex-wrap: wrap }
  .checkin h2 { width: 100%; font-size: 18px; font-weight: 800; display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
  .checkin label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 700; color: #6b6e75 }
  .checkin select, .checkin input { font: 600 15px var(--font); padding: 6px 8px; border: 2.5px solid var(--ink); border-radius: 6px; background: #fff; min-width: 150px; color: var(--ink) }
  .checkin input { width: 110px; min-width: 0; font-family: var(--mono) }
  .checkin #lgS { width: 200px; font-family: var(--font) }
  .checkin button { background: var(--sun); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); border-radius: 6px; font: 800 15px var(--font); padding: 6px 16px; cursor: pointer }
  .checkin .note { width: 100%; font-size: 13px; color: #4a4d55; min-height: 1em } .checkin .err { color: var(--red); font-weight: 700 }

  /* карта */
  .map { margin-top: 22px; position: relative; overflow: hidden; background: #cfe3e8; padding: 0 }
  .map-hd { position: absolute; left: 14px; top: 12px; z-index: 2 }
  .map svg { display: block; width: 100%; height: auto }
  .bld { cursor: pointer; transition: transform .18s; transform-box: fill-box }
  .bld:hover, .bld:focus-visible { transform: translateY(-6px); outline: none }
  .bld:hover .badge rect.b, .bld:focus-visible .badge rect.b { fill: var(--sun) }
  .bld.off { cursor: default }
  .route { fill: none; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; animation: march 1.2s linear infinite }
  @keyframes march { to { stroke-dashoffset: -22 } }
  .smoke { animation: puff 3.2s ease-in infinite; opacity: 0; transform-box: fill-box; transform-origin: center }
  .smoke:nth-of-type(2) { animation-delay: 1.1s } .smoke:nth-of-type(3) { animation-delay: 2.2s }
  @keyframes puff { 0% { opacity: .0; transform: translate(0, 0) scale(.6) } 20% { opacity: .75 } 100% { opacity: 0; transform: translate(14px, -46px) scale(1.6) } }
  .bob { animation: bob 2.4s ease-in-out infinite }
  @keyframes bob { 50% { transform: translateY(-5px) } }
  .crane { animation: swing 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100% }
  @keyframes swing { 50% { transform: rotate(-4deg) } }
  @media (prefers-reduced-motion: reduce) { .route, .smoke, .bob, .crane { animation: none } .smoke { opacity: .6 } }

  /* миры — карточками под картой (и для телефона) */
  .worlds { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; margin-top: 26px }
  .world { display: grid; grid-template-columns: 86px 1fr; gap: 14px; padding: 14px 16px; text-decoration: none; transition: transform .15s; align-items: center }
  a.world:hover { transform: translateY(-3px) }
  .world .ico { width: 86px; height: 86px; border: 3px solid var(--ink); border-radius: 10px; display: grid; place-items: center; font-size: 46px; box-shadow: 3px 3px 0 var(--ink) }
  .world h3 { font-size: 22px; font-weight: 800 }
  .world p { font-size: 14px; color: #4a4d55; margin-top: 3px; line-height: 1.4 }
  .world .meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; font: 700 13px var(--mono) }
  .world .bar { flex: 1; height: 8px; background: #e3dccb; border-radius: 4px; overflow: hidden; border: 1.5px solid var(--ink) }
  .world .bar i { display: block; height: 100%; background: var(--green) }
  .world.soon { opacity: .75 }
  .st { font: 800 12px var(--mono); letter-spacing: .1em; padding: 2px 7px; border-radius: 4px; background: var(--ink); color: #7fe39a; white-space: nowrap }
  .st.later { color: var(--sun) }
  footer { margin-top: 22px; text-align: center; font-size: 13px; font-weight: 600; color: #4a4d55 }
  @media (max-width: 820px) { .hero { grid-template-columns: auto 1fr } .who { grid-column: 1 / -1; text-align: left; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap } }
  @media (max-width: 420px) { .logo { width: 56px; height: 56px } .world { grid-template-columns: 64px 1fr } .world .ico { width: 64px; height: 64px; font-size: 34px } }
</style>
</head>
<body>
<main>
  <header class="hero panel">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40"><g stroke="#22252b" stroke-width="2.4" stroke-linejoin="round" fill="#fffaf0">
      <path d="M4 34 L4 18 L12 14 L12 34Z"/><path d="M13 34 L13 8 L23 4 L23 34Z" fill="#2f6f73"/><path d="M24 34 L24 16 L36 20 L36 34Z"/>
      <path d="M2 35 H38" fill="none"/></g></svg></div>
    <div>
      <span class="tag">Основы проектирования баз данных</span>
      <h1>Город SQL</h1>
      <div class="motto">SELECT * FROM city WHERE robot = 'на смене';</div>
    </div>
    <div class="who">
      <div class="clock" id="clock">--:--</div>
      <div id="who"></div>
    </div>
  </header>

  <section class="checkin panel" id="checkin" hidden aria-label="Вход">
    <h2><span class="tag">Пропуск в город</span>Войдите один раз — дальше все лабы откроются сразу</h2>
    <label>Группа<select id="lgG"></select></label>
    <label>Фамилия<input id="lgS" autocomplete="family-name" placeholder="например: Иванов"></label>
    <label>PIN<input id="lgP" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4 цифры"></label>
    <button id="lgGo">Войти</button>
    <div class="note" id="lgNote"></div>
  </section>

  <section class="map panel" aria-label="Карта города">
    <div class="map-hd"><span class="tag">Карта · где работает робот-СУБД</span></div>
    <svg id="city" viewBox="0 0 1180 720" role="img" aria-label="Город: аэропорт, пиццерия, стройка"></svg>
  </section>

  <section class="worlds" id="worlds" aria-label="Места работы"></section>

  <footer>Колледж ИИ · Тюменский государственный университет</footer>
</main>

<script>
const {$, esc} = Home;
// ════════════════════════════════════════════════ изометрия ══
// x — вправо-вниз, y — влево-вниз, z — вверх; клетка U пикселей
const U = 30, OX = 470, OY = 70, C30 = 0.866;
const P = (x, y, z = 0) => [OX + (x - y) * U * C30, OY + (x + y) * U * 0.5 - z * U];
const pts = a => a.map(p => P(...p).map(v => v.toFixed(1)).join(',')).join(' ');
const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16), f = c => Math.round(c * k);
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(f).map(c => c.toString(16).padStart(2, '0')).join('');
};
const SW = 'stroke="#22252b" stroke-width="2" stroke-linejoin="round"';
const poly = (a, fill, extra = '') => `<polygon points="${pts(a)}" fill="${fill}" ${SW} ${extra}/>`;
// коробка: видны верх, грань к зрителю слева (y + d) и справа (x + w)
function box(x, y, z, w, d, h, c, o = {}) {
  const top = o.top || c;
  return (
    poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], o.right || shade(c, 0.72)) +
    poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], o.left || shade(c, 0.86)) +
    poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], top)
  );
}
const flat = (x, y, w, d, c, z = 0.01) => poly([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], c, 'stroke-width="0"');
const tree = (x, y, s = 1) =>
  box(x - 0.08, y - 0.08, 0, 0.16, 0.16, 0.5 * s, '#8b6a4a') + box(x - 0.42 * s, y - 0.42 * s, 0.45 * s, 0.84 * s, 0.84 * s, 0.75 * s, '#5aa86e');
// подпись-«табличка» над зданием
function badge(x, y, z, title, sub, w = 190) {
  const [px, py] = P(x, y, z);
  return `<g class="badge" transform="translate(${(px - w / 2).toFixed(1)},${(py - 52).toFixed(1)})">
    <rect class="b" width="${w}" height="46" rx="7" fill="#fffaf0" ${SW} stroke-width="2.5"/>
    <text x="${w / 2}" y="20" text-anchor="middle" font-family="Rubik, sans-serif" font-weight="800" font-size="16" fill="#22252b">${esc(title)}</text>
    <text x="${w / 2}" y="37" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="12" fill="#6b6e75">${esc(sub)}</text>
    <path d="M${w / 2 - 7} 46 L${w / 2} 54 L${w / 2 + 7} 46Z" fill="#fffaf0" ${SW} stroke-width="2.5"/></g>`;
}

// ══════════════════════════════════════════════════ город ══
function draw(state) {
  let s = '';
  // остров и вода вокруг
  s += box(0, 0, -0.7, 24, 16, 0.7, '#e7dfcf', {top: '#efe9dc'});
  // газоны
  s += flat(0.3, 8.6, 9.4, 7.1, '#cfe2b4');
  s += flat(13.6, 0.3, 10.1, 5.4, '#e3dccb');
  // дороги: вдоль и поперёк, с разметкой
  s += flat(0, 6.2, 24, 1.8, '#4a4f5c') + flat(10.6, 0, 1.8, 16, '#4a4f5c');
  for (let x = 0.5; x < 24; x += 1.6) if (x < 10.2 || x > 12.6) s += flat(x, 7.04, 0.8, 0.12, '#ffc21a', 0.02);
  for (let y = 0.5; y < 16; y += 1.6) if (y < 5.8 || y > 8.2) s += flat(11.44, y, 0.12, 0.8, '#ffc21a', 0.02);

  // ── аэропорт: терминал с вышкой позади, перед ним полоса с самолётом
  let a = '';
  a += box(1.4, 0.5, 0, 6.8, 2.2, 1.5, '#f3efe6', {top: '#fffaf0'});
  a += box(1.7, 2.7, 0.55, 6.2, 0.06, 0.55, '#9fc3d8', {left: '#9fc3d8'}) + box(1.4, 0.5, 1.5, 6.8, 2.2, 0.15, '#ffc21a');
  a += box(8.7, 0.7, 0, 0.8, 0.8, 3.0, '#f3efe6') + box(8.35, 0.35, 3.0, 1.5, 1.5, 0.7, '#9fc3d8', {top: '#3f474d'}) + box(8.3, 0.3, 3.7, 1.6, 1.6, 0.15, '#3f474d');
  a += flat(0.4, 3.3, 9.8, 2.4, '#5b606b', 0.02);
  for (let x = 1; x < 9.8; x += 1.4) a += flat(x, 4.45, 0.8, 0.1, '#fffaf0', 0.03);
  // самолёт: крыло, фюзеляж, хвост — в порядке «от дальнего к ближнему»
  a += box(4.0, 3.0, 0.45, 1.1, 3.0, 0.12, '#eef0f2');
  a += box(2.0, 4.1, 0.25, 5.0, 0.8, 0.65, '#fbf8f2') + box(2.0, 4.1, 0.55, 5.0, 0.8, 0.08, '#ffc21a', {top: '#fbf8f2'});
  a += box(6.4, 4.3, 0.9, 0.55, 0.4, 0.8, '#eef0f2') + box(1.7, 4.25, 0.3, 0.35, 0.5, 0.45, '#fbf8f2');
  a += tree(0.8, 2.6, 0.8);
  s += `<a class="bld" href="airport/" aria-label="Аэропорт: ЛР-13–16"><g>${a}${badge(4.8, 1.6, 3.1, '✈ Аэропорт', state.air)}</g></a>`;

  // ── стройка: следующий мир
  let c = '';
  c += box(14.4, 1.0, 0, 3.6, 2.6, 0.9, '#d9d2c2', {top: '#c9c2b2'});
  for (let i = 0; i < 5; i++) c += box(14.2 + i * 0.9, 3.9, 0, 0.12, 0.12, 0.6, '#ffc21a');
  c += box(14.2, 3.9, 0.45, 3.7, 0.1, 0.12, '#ffc21a');
  c += `<g class="crane">${box(19.8, 1.4, 0, 0.35, 0.35, 4.2, '#ffc21a') + box(17.0, 1.45, 4.2, 4.4, 0.25, 0.22, '#ffc21a') + box(21.0, 1.35, 3.6, 0.6, 0.45, 0.5, '#3f474d')}</g>`;
  s += `<g class="bld off">${c}${badge(17, 2, 3.4, '🏗 Скоро', 'следующие лабы', 170)}</g>`;

  // ── пиццерия
  let z = '';
  z += flat(13.4, 8.6, 9.6, 6.8, '#f2e3c9');
  z += box(15.0, 9.2, 0, 5.4, 3.2, 1.6, '#fff1dc', {top: '#b5523b'});
  z += box(15.6, 12.4, 0.5, 4.2, 0.05, 0.7, '#9fc3d8', {left: '#9fc3d8'}) + box(16.0, 12.4, 0, 0.9, 0.06, 1.1, '#6d4f3a', {left: '#6d4f3a'});
  for (let i = 0; i < 9; i++) z += box(15.0 + i * 0.6, 12.4, 1.2, 0.6, 0.55, 0.14, i % 2 ? '#fffaf0' : '#d2483c');
  z += box(19.2, 9.6, 1.6, 0.5, 0.5, 1.1, '#8b857a');
  // дым из печи
  const [sx, sy] = P(19.45, 9.85, 2.75);
  z += `<g>${[0, 1, 2].map(() => `<circle class="smoke" cx="${sx}" cy="${sy}" r="9" fill="#fffaf0" stroke="#22252b" stroke-width="2"/>`).join('')}</g>`;
  // вывеска-пицца на крыше
  const [qx, qy] = P(16.6, 10.6, 3.0);
  z += `<line x1="${qx}" y1="${qy}" x2="${qx}" y2="${qy + 36}" stroke="#22252b" stroke-width="4"/>
    <g transform="translate(${qx},${qy})"><circle r="27" fill="#e8b866" stroke="#22252b" stroke-width="2.5"/><circle r="20" fill="#ffd36b" stroke="#c9852c" stroke-width="2"/>
    ${[[-8, -6], [7, -9], [9, 6], [-6, 9], [0, 0]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="#d2483c" stroke="#22252b" stroke-width="1.2"/>`).join('')}</g>`;
  // столики с зонтами
  [[21.2, 13.4], [22.4, 11.6]].forEach(([x, y]) => {
    z += box(x - 0.3, y - 0.3, 0, 0.6, 0.6, 0.45, '#fffaf0') + box(x - 0.05, y - 0.05, 0.45, 0.1, 0.1, 0.8, '#3f474d') + box(x - 0.7, y - 0.7, 1.2, 1.4, 1.4, 0.1, '#d2483c');
  });
  // скутер доставки
  z += box(14.0, 13.6, 0.2, 0.9, 0.35, 0.35, '#d2483c') + box(14.65, 13.55, 0.55, 0.4, 0.45, 0.35, '#ffc21a');
  s += `<a class="bld" href="pizza/" aria-label="Пиццерия: ЛР-17–20"><g>${z}${badge(18.2, 10.6, 4.6, '🍕 SQL Pizza', state.pizza)}</g></a>`;

  // ── парк
  s += tree(1.6, 9.6) + tree(3.2, 10.8, 1.2) + tree(1.4, 12.6, 0.9) + tree(5.4, 13.6) + tree(7.6, 10.2, 1.1) + tree(8.6, 14.2, 0.8) + tree(3.8, 14.6, 0.9);
  s += flat(4.4, 11.4, 2.2, 1.4, '#9fc3d8', 0.02);

  // маршрут робота: из аэропорта по дорогам к пиццерии
  const route = [[5.2, 5.9], [5.2, 7.1], [11.5, 7.1], [11.5, 11], [15, 11]].map(([x, y]) => P(x, y, 0.04).join(',')).join(' ');
  s += `<polyline class="route" points="${route}"/>`;
  // робот — там, где сейчас работа
  const [rx, ry] = state.robotAt === 'pizza' ? P(13.2, 11, 0) : P(6.4, 7.1, 0);
  s += `<g transform="translate(${rx},${ry})"><g class="bob"><g transform="translate(-14,-46)">
    <rect x="2" y="16" width="24" height="22" rx="6" fill="#fffaf0" stroke="#22252b" stroke-width="2.5"/>
    <rect x="6" y="20" width="16" height="9" rx="2" fill="#22252b"/><circle cx="10.5" cy="24.5" r="2" fill="#ffc21a"/><circle cx="17.5" cy="24.5" r="2" fill="#ffc21a"/>
    <line x1="14" y1="16" x2="14" y2="8" stroke="#22252b" stroke-width="2.5"/><circle cx="14" cy="6" r="4" fill="#8a5bd6" stroke="#22252b" stroke-width="2"/>
    <rect x="4" y="38" width="20" height="6" rx="3" fill="#8a5bd6" stroke="#22252b" stroke-width="2"/></g></g></g>`;
  $('city').innerHTML = s;
}

// ══════════════════════════════════════════ миры и прогресс ══
const sum = (labs, prog, open) => {
  const live = labs.filter(l => Home.live(l, open));
  const all = labs.reduce((n, l) => n + Home.LABS[l].levels.length, 0);
  const done = live.reduce((n, l) => n + (prog[l] || Home.progress(Home.LABS[l])).done, 0);
  return {live: live.length, done, all: live.reduce((n, l) => n + Home.LABS[l].levels.length, 0), total: all};
};
function render(open, prog = {}) {
  const air = sum(Home.WORLDS.airport, prog, open),
    pz = sum(Home.WORLDS.pizza, prog, open);
  draw({
    air: `ЛР-13–16 · ${air.done}/${air.all}`,
    pizza: pz.live ? `ЛР-17–20 · ${pz.done}/${pz.all}` : 'ЛР-17–20 · скоро',
    robotAt: pz.live ? 'pizza' : 'airport',
  });
  const card = (href, ico, bg, title, labs, text, st, live) =>
    `<${live ? `a href="${href}"` : 'div'} class="world panel${live ? '' : ' soon'}">
      <div class="ico" style="background:${bg}">${ico}</div>
      <div><h3>${title}</h3><p>${text}</p>
      <div class="meta"><span>${labs}</span>${st}</div></div></${live ? 'a' : 'div'}>`;
  const bar = w => `<span class="bar"><i style="width:${w.all ? (w.done / w.all) * 100 : 0}%"></i></span><span>${w.done}/${w.all}</span>`;
  $('worlds').innerHTML =
    card('airport/', '✈', '#ffc21a', 'Аэропорт', 'ЛР-13–16', 'Рейсы, пассажиры, багаж: INSERT, UPDATE и DELETE, выборка и соединение таблиц.', bar(air), true) +
    card('pizza/', '🍕', '#d2483c', 'SQL Pizza', 'ЛР-17–20', 'Заказы, пиццы, курьеры: итоги смены — GROUP BY и HAVING, подзапросы, закрепление и касса — транзакции.', pz.live ? bar(pz) : '<span class="st later">СКОРО</span>', true);
}
let OPEN = null;
render(OPEN);
const pull = () => Home.pull(Object.keys(Home.LABS).filter(l => Home.live(l, OPEN)).map(l => Home.LABS[l])).then(p => render(OPEN, p));
Home.labsOpen().then(o => {
  OPEN = o;
  render(OPEN);
  pull();
});
Home.showWho($('who'));
Home.checkin(() => {
  Home.showWho($('who'));
  pull();
});
Home.clock($('clock'));
</script>
</body>
</html>

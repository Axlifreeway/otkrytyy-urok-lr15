<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЛР-19 · Закрепление</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common/lab3d.css">
<style>:root { --sql-h: 110px; --sql-resize: vertical }</style>
</head>
<body>
<div id="stage"></div>
<div id="side"><div id="levels" class="panel"></div><div id="mission" class="panel"></div></div>
<div id="topR"><button class="btn sub" id="subBtn">Сдать</button><button class="btn" id="homeBtn">Обзор</button><button class="btn" id="gfxBtn">Графика</button><button class="btn" id="sndBtn">Звук</button><button class="btn" id="menuBtn">Выход</button></div>
<div id="cnt" class="panel" hidden></div>
<div id="cmd" class="panel" hidden></div>
<div id="verdict"></div>
<div id="deck" class="panel">
  <textarea id="sql" spellcheck="false" placeholder="SELECT … FROM … WHERE … GROUP BY … ORDER BY …;     Ctrl+Enter — пуск · Ctrl+↑ — прошлая команда"></textarea>
  <button id="runBtn">▶ ПУСК</button>
  <div class="spd">скорость <button data-spd="1">×1</button><button data-spd="3" class="on">×3</button><button data-spd="99">⏭</button></div>
  <button class="btn sm" id="rsDeck" title="Вернуть базу к началу уровня; команда останется">↺ Сброс уровня</button>
  <div id="result"></div>
</div>
<div id="rewind" hidden></div>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<div id="proto" hidden></div>
<div id="loading">Разогреваю печь…</div>
<script src="game.js"></script>
</body>
</html>
